[project]
name = "phishing-url-detection"
version = "2.0.0"
description = "Leakage-resistant lexical phishing URL detection"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.3",
  "tldextract>=5.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "matplotlib>=3.9",
  "pyarrow>=17.0",
  "httpx>=0.27",
  "pytest>=8.3",
  "streamlit>=1.40",
  "huggingface-hub>=2.4.0",
  "nbformat>=5.11.1",
  "lightgbm>=4.7.0",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
